# Dispatch — release build (P-DSP-15)
#
# Runs ONLY on `v*` tag push + manual `workflow_dispatch` (test the build
# without cutting a release). Never on schedule, never on every push.
# Tagging + release cut is the human's manual step; this workflow only builds.
#
# Action pick: softprops/action-gh-release over tauri-apps/tauri-action.
# tauri-action bundles build+release inside one opaque step, hiding toolchain,
# cache, and test wiring; softprops does one thing (attach files to a GitHub
# Release) and leaves `npm ci` / `tsc` / `npm test` / `tauri build` explicit so
# caching, gates, and the version check stay visible and auditable. It is the
# widely-maintained generic release-assets action with a stable API (files
# globs, draft/prerelease flags, fail_on_unmatched_files).

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # required by softprops/action-gh-release to attach assets

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24 (npm cache)
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm # keyed by package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Caches cargo registry + src-tauri/target, keyed by Cargo.lock.
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Version consistency check
        shell: pwsh
        run: |
          $refType = $env:GITHUB_REF_TYPE
          $refName = $env:GITHUB_REF_NAME
          $pkg = (Get-Content package.json | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $cargoLine = Select-String '^version = "(.*)"' src-tauri/Cargo.toml | Select-Object -First 1
          $cargo = $cargoLine.Matches.Groups[1].Value
          Write-Output "package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo ref_type=$refType ref_name=$refName"
          if ($pkg -ne $tauri -or $pkg -ne $cargo) {
            Write-Error "Version mismatch: package.json=$pkg tauri.conf.json=$tauri Cargo.toml=$cargo"
            exit 1
          }
          if ($refType -eq "tag") {
            $expected = $refName -replace '^v', ''
            if ($pkg -ne $expected) {
              Write-Error "Tag/version mismatch: tag=$refName expected=$expected package.json=$pkg"
              exit 1
            }
          }
          Write-Output "Version check OK: $pkg"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Tauri build
        run: npx tauri build

      - name: Attach bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: true
